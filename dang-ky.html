<style>
  :root {
    --ink: #183b3b; --deep: #234747; --forest: #37685f; --sage: #6f9c8f; --sage-light: #b8d1ca;
    --mist: #edf4f1; --cream: #f7f3ee; --paper: #fffdf9; --pink: #e9b2b8; --pink-light: #f4d8d8;
    --line: rgba(24, 59, 59, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', Arial, sans-serif; background: var(--mist); color: var(--ink);
    line-height: 1.6; padding: 40px 20px; -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 480px; margin: 0 auto; background: var(--paper); padding: 36px 32px; border-radius: 26px;
    box-shadow: 0 20px 60px rgba(24,59,59,.12); border: 1px solid var(--line);
  }
  h1 { font-family: 'Lora', serif; font-weight: 500; font-size: 25px; line-height: 1.2; margin-bottom: 10px; color: var(--ink); }
  .lead { color: #5b7370; margin-bottom: 26px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--ink); }
  input, select {
    width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 15px;
    font-family: inherit; background: var(--mist); color: var(--ink);
  }
  input:focus, select:focus { outline: none; border-color: var(--sage); }
  .cta {
    width: 100%; align-items: center; background: var(--deep); border: 1px solid var(--deep); color: #fff;
    padding: 16px; font-size: 15px; font-weight: 700; font-family: 'Plus Jakarta Sans', sans-serif;
    border-radius: 999px; cursor: pointer; margin-top: 22px; transition: background 180ms ease, transform 180ms ease;
  }
  .cta:hover { background: #143938; transform: translateY(-1px); }
  .cta:disabled { background: var(--sage-light); border-color: var(--sage-light); cursor: not-allowed; transform: none; }
  .error { color: #a85c3c; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Đăng ký Workshop Đánh Thức Vẻ Rạng Rỡ Tự Nhiên</h1>
  <p class="lead">Điền thông tin để tiếp tục đến trang thanh toán.</p>

  <form id="orderForm">
    <label>Họ tên *</label>
    <input type="text" name="name" required>

    <label>Số điện thoại *</label>
    <input type="tel" name="phone" required pattern="[0-9]{10,11}">

    <label>Email *</label>
    <input type="email" name="email" required>

    <label>Bạn đang mong muốn điều gì nhất?</label>
    <select name="goal">
      <option value="">-- Chọn mục tiêu --</option>
      <option value="Tìm lại năng lượng, bớt mệt mỏi">Tìm lại năng lượng, bớt mệt mỏi</option>
      <option value="Chăm sóc & nuôi dưỡng sự tươi trẻ">Chăm sóc &amp; nuôi dưỡng sự tươi trẻ</option>
      <option value="Cân bằng giữa công việc & bản thân">Cân bằng giữa công việc &amp; bản thân</option>
    </select>

    <button type="submit" class="cta" id="submitBtn">Tiếp tục thanh toán →</button>
    <p class="error" id="error"></p>
  </form>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxAA70FFvoQie5cUvlkletmi9rNsAYpKGNdZjqC3J5KBxSpFd7YaGhLLnngtPZSEIGMgw/exec';

  document.getElementById('orderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('error');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Đang xử lý...';

    const form = new FormData(e.target);
    const data = {
      name: form.get('name'),
      phone: form.get('phone'),
      email: form.get('email'),
      goal: form.get('goal'),
      bump1: false,
      bump2: false,
      totalAmount: 99000
    };

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'createOrder', data: data })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'Order creation failed');

      sessionStorage.setItem('order', JSON.stringify({
        orderId: json.orderId,
        ckContent: json.ckContent,
        totalAmount: json.totalAmount,
        name: data.name,
        email: data.email,
        phone: data.phone,
        goal: data.goal
      }));

      if (typeof fbq !== 'undefined') {
        fbq('track', 'Lead', { value: 99000, currency: 'VND', content_name: 'Đăng ký workshop' });
      }

      window.location.href = '/checkout';
    } catch (err) {
      errEl.textContent = 'Lỗi: ' + err.message + '. Vui lòng thử lại.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Tiếp tục thanh toán →';
    }
  });
</script>
</body>
</html>
