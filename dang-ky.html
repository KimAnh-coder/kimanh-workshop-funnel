<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kim Anh Amala — Đăng ký</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #FFFCF5; color: #3D2F1F; line-height: 1.6; padding: 40px 20px; }
  .container { max-width: 480px; margin: 0 auto; background: #FFF9EC; padding: 32px; border-radius: 14px; box-shadow: 0 4px 16px rgba(184,134,11,0.12); border: 1px solid rgba(184,134,11,0.18); }
  h1 { font-family: 'Lora', serif; font-size: 24px; margin-bottom: 8px; color: #3D2F1F; }
  .lead { color: #8A7A63; margin-bottom: 24px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; color: #3D2F1F; }
  input, select { width: 100%; padding: 12px; border: 1px solid rgba(184,134,11,0.3); border-radius: 8px; font-size: 15px; font-family: inherit; background: #FFFCF5; color: #3D2F1F; }
  input:focus, select:focus { outline: none; border-color: #B8860B; }
  .cta { width: 100%; background: linear-gradient(135deg, #B8860B 0%, #8C6508 100%); color: #FFFCF2; padding: 14px; font-size: 16px; font-weight: 700; font-family: 'Lora', serif; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
  .cta:hover { opacity: 0.92; }
  .cta:disabled { background: #C9BBA0; cursor: not-allowed; }
  .error { color: #A85C5C; font-size: 13px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Đăng ký Workshop Đánh Thức Vẻ Rạng Rỡ Tự Nhiên</h1>
  <p class="lead">Điền thông tin để tiếp tục đến trang thanh toán.</p>

  <form id="orderForm">
    <label>Họ tên *</label>
    <input type="text" name="name" required>

    <label>Số điện thoại *</label>
    <input type="tel" name="phone" required pattern="[0-9]{10,11}">

    <label>Email *</label>
    <input type="email" name="email" required>

    <label>Bạn đang mong muốn điều gì nhất?</label>
    <select name="goal">
      <option value="">-- Chọn mục tiêu --</option>
      <option value="Tìm lại năng lượng, bớt mệt mỏi">Tìm lại năng lượng, bớt mệt mỏi</option>
      <option value="Chăm sóc & nuôi dưỡng sự tươi trẻ">Chăm sóc &amp; nuôi dưỡng sự tươi trẻ</option>
      <option value="Cân bằng giữa công việc & bản thân">Cân bằng giữa công việc &amp; bản thân</option>
    </select>

    <button type="submit" class="cta" id="submitBtn">Tiếp tục thanh toán →</button>
    <p class="error" id="error"></p>
  </form>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxAA70FFvoQie5cUvlkletmi9rNsAYpKGNdZjqC3J5KBxSpFd7YaGhLLnngtPZSEIGMgw/exec';

  document.getElementById('orderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('error');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Đang xử lý...';

    const form = new FormData(e.target);
    const data = {
      name: form.get('name'),
      phone: form.get('phone'),
      email: form.get('email'),
      goal: form.get('goal'),
      bump1: false,
      bump2: false,
      totalAmount: 99000
    };

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'createOrder', data: data })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'Order creation failed');

      sessionStorage.setItem('order', JSON.stringify({
        orderId: json.orderId,
        ckContent: json.ckContent,
        totalAmount: json.totalAmount,
        name: data.name,
        email: data.email,
        phone: data.phone,
        goal: data.goal
      }));

      window.location.href = '/checkout';
    } catch (err) {
      errEl.textContent = 'Lỗi: ' + err.message + '. Vui lòng thử lại.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Tiếp tục thanh toán →';
    }
  });
</script>
</body>
</html>
